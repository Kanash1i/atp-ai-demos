server:
  port: ${MCP_SERVER_PORT:8090}
  # k8s 滚动更新时先摘流量再退出，避免正在处理的 normalize 请求被硬切
  shutdown: graceful

spring:
  application:
    name: atp-normalizer

  # 配置统一从仓库根目录的 .env 读取（CLAUDE.md 硬约束：代码里不得出现硬编码 key / URL / IP）。
  # optional: 前缀让 .env 缺席时也能启动 —— CI 和容器里靠环境变量注入，没有这个文件。
  config:
    import: "optional:file:../.env[.properties]"

  lifecycle:
    timeout-per-shutdown-phase: 20s

  ai:
    mcp:
      server:
        # ⭐ 不可改：默认值是 STREAMABLE，会维持 session。
        # k8s 多副本下请求被 LB 打到不同 pod → 第二个请求找不到 session → 直接失败。
        # STATELESS 让每个请求自包含，无 session 亲和性要求。
        # 我们的业务本来就无状态（每次 normalize 独立、不碰 DB），此处没有任何妥协。
        protocol: ${MCP_PROTOCOL:STATELESS}
        name: atp-normalizer
        version: 0.1.0
        instructions: >
          ATP 测试案例规范化服务。把任意形状的测试案例 JSON 转换为 ATP 平台
          关系型 schema 所要求的规范形态，并给出分级诊断与字段来源(provenance)。
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          # M0 只暴露 tool，其余能力等对应里程碑做完再开，避免向客户端声明空能力
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true        # 暴露 /actuator/health/liveness 与 /readiness
      show-details: always
