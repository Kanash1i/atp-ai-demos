<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>パスワード再設定 · ATP Shop</title>
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>
<div id="header-slot"></div>
<main id="app"></main>
<script src="/js/cart.js"></script>
<script src="/js/shop.js"></script>
<script>
  const app = document.getElementById("app");
  const token = new URLSearchParams(location.search).get("token") || "";
  app.innerHTML = `
    <form class="login-form" onsubmit="return false">
      <h2>パスワードの再設定</h2>
      <input type="hidden" data-testid="reset-token" value="${token}">
      <label>新しいパスワード<input data-testid="new-password" type="password"></label>
      <label>新しいパスワード（確認）<input data-testid="new-password-confirm" type="password"></label>
      <div data-testid="reset-error" class="form-error"></div>
      <button data-testid="reset-submit" class="btn btn-primary">変更する</button>
      <div data-testid="reset-success" class="form-error" style="color:#2e7d5b"></div>
    </form>`;
  const $ = (t) => app.querySelector(`[data-testid="${t}"]`);
  $("reset-submit").onclick = () => {
    const a = $("new-password").value, b = $("new-password-confirm").value;
    $("reset-error").textContent = ""; $("reset-success").textContent = "";
    if (!a || a !== b) { $("reset-error").textContent = "パスワードが一致しません"; return; }
    $("reset-success").textContent = "パスワードを変更しました";
  };
</script>
</body>
</html>
