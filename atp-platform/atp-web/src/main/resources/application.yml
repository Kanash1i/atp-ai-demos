server:
  port: ${ATP_PORT:8080}
  tomcat:
    # ⚠️ 执行节点 PUT 上来的录像可能有几 MB，Tomcat 默认 2MB 会直接拒收，
    #    而报错在节点侧看是「HTTP 400」，很难联想到是体积限制。
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

spring:
  application:
    name: atp-platform

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      # ⚠️ 必须显式配超时与连接池。默认配置下长时间空闲的连接会悄悄失效，
      #    再用时命令一直挂到 60 秒默认超时才报错 —— 表现是「派发接口 500」，
      #    而 Redis 本身 PING 得通、队列也正常，排查方向很容易被带偏。
      #    跨 Tailscale 到家里的台式机时，链路更容易断，这个配置更不能省。
      timeout: 3s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          # 借出连接前先探活，拿到死连接就直接换一条
          time-between-eviction-runs: 30s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # ⚠️ 配置一律来自仓库根 .env，代码与 yml 里不得出现硬编码的 URL / 口令。
    #    启动脚本负责把 .env 载入环境变量（见 scripts/run-web.sh）。
    url: ${ATP_DB_URL}
    username: ${ATP_DB_USER}
    password: ${ATP_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      connect-properties:
        # ⭐ 让 PG 把 String 隐式转成 jsonb。tc_step.step_json 因此可以按字符串原样写入，
        #    与 CLI（Go）那侧写进去的字节完全一致 —— 不会因为两套 JSON 库而产生格式差异。
        stringtype: unspecified

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      # 主键由应用层生成：AI 案例是 UUID，人工案例是平台雪花 ID，两者并存
      id-type: input

atp:
  # 执行产物根目录。⚠️ 必须与 atp-runner 的 artifact-dir 指向同一处（同机时）
  artifact-dir: ${ATP_ARTIFACT_DIR:/tmp/atp-artifacts}
  seed:
    # 默认关。开启：--atp.seed.enabled=true
    enabled: ${ATP_SEED_ENABLED:false}
    # 相对路径的基准是模块目录 atp-web/，所以是 ../../seed。启动脚本会用绝对路径覆盖它
    dir: ${ATP_SEED_DIR:../../seed}

# Sa-Token：与 gogo-agent 的取舍保持一致（token 放请求头、30 天、不共享 token、随机 128 位）
sa-token:
  token-name: Authorization
  timeout: 2592000
  # 动态活跃续期关掉：演示期间不希望 token 因为闲置被踢
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-print: false

logging:
  level:
    com.atp: INFO
