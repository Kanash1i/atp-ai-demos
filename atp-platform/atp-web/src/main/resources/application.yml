server:
  port: ${ATP_PORT:8080}
  tomcat:
    # ⚠️ 执行节点 PUT 上来的录像可能有几 MB，Tomcat 默认 2MB 会直接拒收，
    #    而报错在节点侧看是「HTTP 400」，很难联想到是体积限制。
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

spring:
  application:
    name: atp-platform

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      # ⚠️ 必须显式配超时与连接池。默认配置下长时间空闲的连接会悄悄失效，
      #    再用时命令一直挂到 60 秒默认超时才报错 —— 表现是「派发接口 500」，
      #    而 Redis 本身 PING 得通、队列也正常，排查方向很容易被带偏。
      #    跨 Tailscale 到家里的台式机时，链路更容易断，这个配置更不能省。
      timeout: 3s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          # 借出连接前先探活，拿到死连接就直接换一条
          time-between-eviction-runs: 30s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # ⚠️ 配置一律来自仓库根 .env，代码与 yml 里不得出现硬编码的 URL / 口令。
    #    启动脚本负责把 .env 载入环境变量（见 scripts/run-web.sh）。
    url: ${ATP_DB_URL}
    username: ${ATP_DB_USER}
    password: ${ATP_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      connect-properties:
        # ⭐ 让 PG 把 String 隐式转成 jsonb。tc_step.step_json 因此可以按字符串原样写入，
        #    与 CLI（Go）那侧写进去的字节完全一致 —— 不会因为两套 JSON 库而产生格式差异。
        stringtype: unspecified

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      # 主键由应用层生成：AI 案例是 UUID，人工案例是平台雪花 ID，两者并存
      id-type: input

atp:
  auth:
    # 三个演示账号（kaneshiro / sato / tanaka）的统一口令。
    # ⚠️ 这是**虚构演示数据**，不是真实凭据。放配置里而不是硬编码 ——
    #    即便是 demo，把口令写进源码也是个会被复制的坏习惯。
    demo-password: ${ATP_DEMO_PASSWORD:atp-demo-2026}

  # ── 执行侧的补偿参数 ──────────────────────────────────────────
  # ⚠️ 这几项原先只以 @Value 的内联默认值存在，yml 里看不见 ——
  #    结果是运维想调只能改代码。补出来，值与原默认值一致。
  exec:
    # 单条任务的最大重投次数。超过就判定为「这条案例本身有问题」，不再重试
    max-retry: ${ATP_EXEC_MAX_RETRY:2}
    # 心跳超过这么久没更新，判定节点离线（进程崩了不会自己改 status）
    node-offline-seconds: ${ATP_EXEC_NODE_OFFLINE_SEC:90}
    # PENDING 但队列里没有它的号 —— 孤儿任务，扫到就重投
    orphan-threshold-seconds: ${ATP_EXEC_ORPHAN_SEC:60}
    # RUNNING 但认领它的节点已经离线 —— 僵尸任务，扫到就回收
    zombie-threshold-seconds: ${ATP_EXEC_ZOMBIE_SEC:90}

  cors:
    # 前端开发服务器。部署时通过环境变量覆盖成真实域名
    allowed-origins: ${ATP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173}

  # ⭐ 平台 agent 的写侧出口 —— 与 opencode 走同一个二进制，格式漂移物理上不可能。
  #    CLI 读的 ATP_DB_* 与平台是同一组环境变量，子进程直接继承，
  #    凭据始终留在平台侧，不因为「走了 CLI」而落到别处。
  # 页面探查的目标 —— 与执行器的 atp.runner.variables.base_url 是同一个值。
  # agent 探查看到的必须就是执行时会看到的，否则探出来的定位器仍然可能跑不通。
  inspect:
    base-url: ${MOCK_SHOP_URL:http://localhost:8088}

  cli:
    bin: ${ATP_CLI_BIN:../../demo2-atp-cli/bin/atp}
    timeout-seconds: ${ATP_CLI_TIMEOUT:30}

  model:
    # ⚠️ 全部来自仓库根 .env。DeepSeek 兼容 OpenAI 协议，但不是 OpenAI ——
    #    所以绕开 starter 的 provider 枚举，直接构造 OpenAIChatModel 指定 baseUrl
    api-key: ${LLM_API_KEY}
    base-url: ${LLM_BASE_URL}
    # 三档先都指向同一个模型。分档是为了后期换模型时改配置而不是改代码
    fast-name: ${LLM_MODEL}
    strong-name: ${LLM_MODEL}
    stable-name: ${LLM_MODEL}

  rag:
    embedding:
      # ⚠️ 本地 TEI，OpenAI 兼容端点。开工前确认 docker logs tei-embed | grep "model on" 是 Cuda
      base-url: ${EMBEDDING_BASE_URL}/v1
      model: ${EMBEDDING_MODEL}
      dimensions: ${EMBEDDING_DIM:1024}
    store:
      # PgVectorStore 自己建这张表和索引，不在我们的迁移里
      table: ${ATP_RAG_TABLE:rag_vector}
    corpus:
      dir: ${ATP_SEED_DIR:../../seed}/docs

  # 执行产物根目录。⚠️ 必须与 atp-runner 的 artifact-dir 指向同一处（同机时）
  artifact-dir: ${ATP_ARTIFACT_DIR:/tmp/atp-artifacts}
  seed:
    # 默认关。开启：--atp.seed.enabled=true
    enabled: ${ATP_SEED_ENABLED:false}
    # 相对路径的基准是模块目录 atp-web/，所以是 ../../seed。启动脚本会用绝对路径覆盖它
    dir: ${ATP_SEED_DIR:../../seed}

# Sa-Token：与 gogo-agent 的取舍保持一致（token 放请求头、30 天、不共享 token、随机 128 位）
sa-token:
  token-name: Authorization
  # ⭐ 机器主体走标准的 Authorization: Bearer <token>
  token-prefix: Bearer
  timeout: 2592000
  # 动态活跃续期关掉：演示期间不希望 token 因为闲置被踢
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-print: false

logging:
  level:
    com.atp: INFO
